name: Build and protocol tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config curl patch \
            libglib2.0-dev libgusb-dev libgirepository1.0-dev libudev-dev
      - name: Build pinned upstream and run tests
        run: bash scripts/build.sh
