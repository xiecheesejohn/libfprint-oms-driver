name: Build and protocol tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config curl patch \
            libglib2.0-dev libgusb-dev libgirepository1.0-dev libudev-dev
      - name: Build pinned upstream and run tests
        run: bash scripts/build.sh
      - name: Check optional UI source metadata and Python syntax
        run: |
          python3 - <<'PY'
          import json, pathlib, py_compile, xml.etree.ElementTree as ET
          root = pathlib.Path('ui')
          json.loads((root / 'aurora-fingerprint/metadata.json').read_text())
          ET.parse(root / 'aurora-fingerprint/contents/config/main.xml')
          for source in root.rglob('*.py'):
              py_compile.compile(str(source), doraise=True)
          for source in [*pathlib.Path('terminal').rglob('*.py'), *pathlib.Path('scripts').glob('*.py')]:
              py_compile.compile(str(source), doraise=True)
          PY
